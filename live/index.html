<!doctype html>
<meta charset="utf-8">
<title>riposte</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: #e8e8ee; font: 15px -apple-system, "Helvetica Neue", sans-serif; overflow: hidden; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #top, #stats, #bar { position: fixed; left: 48px; }
  #top { top: 36px; font-size: 30px; font-weight: 300; }
  #top small { display: block; font-size: 15px; font-weight: 400; color: #8e8e98; margin-top: 8px; }
  #move { top: 124px; position: fixed; left: 48px; font-size: 44px; font-weight: 300; }
  #move b { color: #6ee7b7; font-weight: 300; font-size: 26px; margin-left: 14px; }
  #stats { bottom: 36px; font-size: 18px; color: #8e8e98; font-variant-numeric: tabular-nums; }
  #stats b { color: #6ee7b7; font-weight: 400; }
  #bar { right: 48px; bottom: 32px; display: none; }
  #line { position: relative; height: 40px; cursor: pointer; }
  #line::before { content: ""; position: absolute; left: 0; right: 0; top: 19px; height: 2px; background: #2a2a32; }
  #line i { position: absolute; top: 10px; height: 20px; min-width: 5px; border-radius: 2px; background: #e8e8ee; opacity: .55; }
  #line i.lunge { background: #6ee7b7; opacity: .9; }
  #line i:hover { opacity: 1; top: 6px; height: 28px; }
  #head { position: absolute; top: 2px; width: 2px; height: 36px; background: #fff; pointer-events: none; }
  #ctl { display: flex; gap: 6px; align-items: center; margin-top: 10px; color: #8e8e98; font-variant-numeric: tabular-nums; }
  #ctl button { background: none; border: 1px solid #2a2a32; color: #e8e8ee; font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  #ctl button.on { border-color: #6ee7b7; color: #6ee7b7; }
  #ctl span { margin-left: 10px; }
  #ctl .key { margin-left: auto; }
  #ctl .key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 6px 0 16px; background: #e8e8ee; opacity: .55; }
  #ctl .key i.lunge { background: #6ee7b7; opacity: .9; }
</style>
<div id="top"></div>
<div id="move"></div>
<div id="stats"></div>
<div id="bar">
  <div id="line"><div id="head"></div></div>
  <div id="ctl">
    <button id="play">Pause</button><button id="back">◀</button><button id="fwd">▶</button>
    <button class="rate on" data-r="1">1×</button><button class="rate" data-r="0.5">½×</button><button class="rate" data-r="0.25">¼×</button>
    <span id="clock"></span>
    <span class="key"><i class="lunge"></i>lunge<i></i>thrust · click one to jump · drag to orbit · scroll to zoom · space, ← →</span>
  </div>
</div>
<canvas id="c"></canvas>
<!--TAKE-->
<script>
const BONES = [[0,5],[0,6],[5,6],[5,7],[7,22],[6,8],[8,21],[5,9],[6,10],[9,10],[9,11],[11,13],[10,12],[12,14],[13,15],[13,17],[14,18],[14,20]];
const ARM = new Set(["6,8", "8,21"]), WRIST = 21, L_ANK = 13, R_ANK = 14, BLADE_M = 0.9, MINT = "#6ee7b7";
const $ = id => document.getElementById(id);
const c = $("c"), g = c.getContext("2d"), take = window.TAKE;
let yaw = 0.6, pitch = 0.16, dist = 6.4;
// What is drawn: joints (right, up, back) from the pelvis, blade direction, where the blade leaves the hand
// (from the wrist), the pelvis in the room, the floor height and the piste's heading.
let cur = null, piste = [1, 0], floor = -0.97;

let held = null;
c.onpointerdown = e => { c.setPointerCapture(e.pointerId); held = [e.clientX, e.clientY]; };
c.onpointermove = e => {
  if (!e.buttons || !held) return;
  yaw += (e.clientX - held[0]) * 0.008;
  pitch = Math.min(1.4, Math.max(-0.05, pitch + (e.clientY - held[1]) * 0.006));
  held = [e.clientX, e.clientY];
};
c.onwheel = e => { dist = Math.min(16, Math.max(2.5, dist * Math.exp(e.deltaY * 0.001))); e.preventDefault(); };

function scene() {
  const w = c.width = c.clientWidth * devicePixelRatio, h = c.height = c.clientHeight * devicePixelRatio;
  if (!cur) return;
  // A 46 mm lens on a 36 mm frame, as render/studio.py's camera.
  const f = w * 46 / 36, cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const at = [cur.root[0], floor + 0.85, cur.root[2]];  // the camera looks at the fencer's middle
  const cam = p => {
    const x = p[0] - at[0], y = p[1] - at[1], z = p[2] - at[2];
    // The camera sits dist away, yaw round from the fencer's front and pitch above their middle.
    const X = x * cy + z * sy, Z = -x * sy + z * cy;
    return [-X, y * cp + Z * sp, dist - y * sp + Z * cp];
  };
  const px = q => [w / 2 + f * q[0] / q[2], h * 0.46 - f * q[1] / q[2], q[2]];
  const NEAR = 0.3;
  const line = (a, b, colour, width) => {
    let p = cam(a), q = cam(b);
    if (p[2] < NEAR && q[2] < NEAR) return;
    // Cut the part behind the camera off: the piste runs past it.
    if (p[2] < NEAR) p = p.map((v, i) => v + (q[i] - v) * (NEAR - p[2]) / (q[2] - p[2]));
    if (q[2] < NEAR) q = q.map((v, i) => v + (p[i] - v) * (NEAR - q[2]) / (p[2] - q[2]));
    p = px(p); q = px(q);
    g.strokeStyle = colour; g.lineWidth = Math.max(1, width * f / ((p[2] + q[2]) / 2));
    g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke();
  };
  g.lineCap = "round";
  // The piste: 1.5 m wide along the line of the feet, a cross line every metre so travel shows.
  const u = piste, v = [-u[1], u[0]], on = (a, b) => [a * u[0] + b * v[0], floor, a * u[1] + b * v[1]];
  const mid = Math.round(at[0] * u[0] + at[2] * u[1]);
  for (const b of [-0.75, 0.75]) line(on(mid - 7, b), on(mid + 7, b), "#3a3a44", 0.012);
  for (let a = mid - 7; a <= mid + 7; a++) line(on(a, -0.75), on(a, 0.75), a ? "#22222a" : "#3a3a44", 0.008);
  const J = cur.pose.map(p => [p[0] + cur.root[0], p[1] + cur.lift, p[2] + cur.root[2]]);
  for (const [a, b] of BONES) line(J[a], J[b], ARM.has(a + "," + b) ? MINT : "#e8e8ee", 0.016);
  if (cur.blade) {
    const a = J[WRIST].map((x, i) => x + cur.grip[i]), b = a.map((x, i) => x + BLADE_M * cur.blade[i]);
    line(J[WRIST], a, MINT, 0.012);  // the hand: the blade leaves it at the guard, not at the wrist
    line(a, b, "#ffffff", 0.007);
    const tip = cam(b);
    if (tip[2] > NEAR) { g.fillStyle = MINT; g.beginPath(); g.arc(...px(tip).slice(0, 2), Math.max(2, 0.02 * f / tip[2]), 0, 7); g.fill(); }
  }
}

if (take) {
  // A recorded take, embedded by live.view: the replay.
  const ints = (s, scale) => Array.from(new Int16Array(Uint8Array.from(atob(s), ch => ch.charCodeAt(0)).buffer), x => x / scale);
  const n = take.n, pose = ints(take.pose, 1000), blade = ints(take.blade, 10000);
  const root = take.root ? ints(take.root, 1000) : null, grip = take.grip ? ints(take.grip, 1000) : null;
  const ground = ints(take.ground, 1000);
  const tri = (a, i) => [a[3 * i], a[3 * i + 1], a[3 * i + 2]];
  piste = take.piste; floor = take.floor;
  yaw = Math.atan2(piste[1], piste[0]);  // open side-on, the fencer facing left, as a camera beside the piste would
  $("top").innerHTML = `${take.name}<small>Apple Watch only · ${root ? "movement along the piste from the watch" : "pelvis held in place"}</small>`;
  $("bar").style.display = "block";
  let i = 0, playing = true, rate = 1, last = performance.now();
  const clock = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
  const kind = e => e.kind === "lunge" ? "Lunge" : "Thrust";
  const hand = e => e.hand == null ? "" : `hand ${e.hand.toFixed(1)} m/s`;
  for (const e of take.events) {
    const m = document.createElement("i");
    m.className = e.kind;
    m.style.left = 100 * e.onset / n + "%";
    m.style.width = 100 * (e.end - e.onset) / n + "%";
    m.title = `${kind(e)} at ${clock(e.onset / take.fps)}${e.hand == null ? "" : " · " + hand(e)}`;
    m.onclick = ev => { i = Math.max(e.onset - take.fps / 2, 0); ev.stopPropagation(); };
    $("line").appendChild(m);
  }
  const seek = e => { const r = $("line").getBoundingClientRect(); i = Math.min(n - 1, Math.max(0, (e.clientX - r.left) / r.width * n)); };
  // A press on a mark is left alone: capturing it would send the click here, not to the mark.
  $("line").onpointerdown = e => { if (e.target.tagName !== "I") { $("line").setPointerCapture(e.pointerId); seek(e); } };
  $("line").onpointermove = e => { if (e.buttons && $("line").hasPointerCapture(e.pointerId)) seek(e); };
  const toggle = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; };
  const step = d => { if (playing) toggle(); i = Math.min(n - 1, Math.max(0, Math.round(i) + d)); };
  $("play").onclick = toggle; $("back").onclick = () => step(-1); $("fwd").onclick = () => step(1);
  for (const b of document.querySelectorAll(".rate")) b.onclick = () => {
    rate = +b.dataset.r;
    document.querySelectorAll(".rate").forEach(x => x.classList.toggle("on", x === b));
  };
  onkeydown = e => {
    if (e.key === " ") toggle(); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1); else return;
    e.preventDefault();
  };
  (function frame(now) {
    requestAnimationFrame(frame);
    if (playing) i = (i + (now - last) / 1000 * take.fps * rate) % n;
    last = now;
    const k = Math.floor(i);
    cur = { pose: Array.from({ length: 30 }, (_, j) => tri(pose, 30 * k + j)), blade: tri(blade, k),
            grip: grip ? tri(grip, k) : [0, 0, 0], root: root ? tri(root, k) : [0, 0, 0], lift: floor - ground[k] };
    scene();
    $("head").style.left = 100 * i / n + "%";
    $("clock").textContent = `${clock(i / take.fps)} / ${clock(n / take.fps)}`;
    const e = take.events.filter(e => e.onset <= k && k <= e.end + take.fps * 0.8).pop();
    $("move").innerHTML = e ? `${kind(e)}<b>${k >= e.peak ? hand(e) : ""}</b>` : "";
  })(last);
} else {
  // No take embedded: live.server is streaming the watch.
  $("top").innerHTML = "Live from the watch<small>Apple Watch only · causal model · pelvis held in place · drag to orbit</small>";
  $("stats").textContent = "waiting for the watch…";
  let msg = null, lat = [], age = [], n = 0, since = performance.now(), fps = 0;
  new EventSource("/events").onmessage = e => { msg = JSON.parse(e.data); n++; };
  (function frame() {
    requestAnimationFrame(frame);
    if (!msg) return scene();
    const feet = [msg.pose[R_ANK][0] - msg.pose[L_ANK][0], msg.pose[R_ANK][2] - msg.pose[L_ANK][2]];
    piste = [piste[0] * 0.98 + feet[0] * 0.02, piste[1] * 0.98 + feet[1] * 0.02];
    const len = Math.hypot(...piste) || 1;
    piste = [piste[0] / len, piste[1] / len];
    cur = { pose: msg.pose, blade: msg.blade, grip: [0, 0, 0], root: [0, 0, 0], lift: 0 };
    scene();
    if (msg.drawn) return;
    msg.drawn = true;
    const now = Date.now();
    lat = lat.concat(now - msg.arrived * 1000).slice(-90);
    age = age.concat(now - msg.t * 1000).slice(-90);
    if (performance.now() - since > 1000) { fps = Math.round(n * 1000 / (performance.now() - since)); n = 0; since = performance.now(); }
    const med = a => a.slice().sort((x, y) => x - y)[a.length >> 1];
    // A replayed recording carries its old timestamps, so only a live stream has a motion-to-screen figure.
    const live = med(age) < 10000 ? ` · motion to screen <b>${med(age).toFixed(0)} ms</b>` : " · replayed recording";
    $("stats").innerHTML = `samples received to pose drawn <b>${med(lat).toFixed(0)} ms</b>${live} · ${fps} poses/s`;
  })();
}
</script>
